version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: myblog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: myblog
      MYSQL_USER: myblog_user
      MYSQL_PASSWORD: myblog_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./myblog-backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - myblog-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: myblog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - myblog-network

  # Elasticsearch搜索引擎
  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: myblog-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - myblog-network

  # 后端服务
  backend:
    build:
      context: ./myblog-backend
      dockerfile: Dockerfile
    container_name: myblog-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: myblog
      MYSQL_USERNAME: myblog_user
      MYSQL_PASSWORD: myblog_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      JWT_SECRET: local_jwt_secret_key_for_development_only_minimum_256_bits
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - redis
      - elasticsearch
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    networks:
      - myblog-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端服务
  frontend:
    build:
      context: ./myblog-frontend
      dockerfile: Dockerfile
    container_name: myblog-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://localhost:8081
    ports:
      - "3000:8080"
    depends_on:
      - backend
    networks:
      - myblog-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nginx反向代理（可选，用于生产环境测试）
  nginx:
    image: nginx:alpine
    container_name: myblog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - myblog-network
    profiles:
      - production

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
  backend_logs:
    driver: local
  backend_uploads:
    driver: local

networks:
  myblog-network:
    driver: bridge