version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: myblog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: myblog
      MYSQL_USER: myblog
      MYSQL_PASSWORD: myblog123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/sql:/docker-entrypoint-initdb.d
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - myblog-network

  redis:
    image: redis:7-alpine
    container_name: myblog-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ""
    networks:
      - myblog-network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: myblog-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - myblog-network

  # Kibana (可选：ES管理界面)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: myblog-kibana
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - myblog-network

  # 可选：添加phpMyAdmin管理MySQL
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: myblog-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: 123456
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - myblog-network

  # 可选：添加Redis Commander管理Redis
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: myblog-redis-commander
    restart: always
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      - redis
    networks:
      - myblog-network

volumes:
  mysql_data:
  redis_data:
  es_data:

networks:
  myblog-network:
    driver: bridge