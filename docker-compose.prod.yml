services:
  # Nginx反向代理
  nginx:
    image: nginx:1.27-alpine
    container_name: myblog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/nginx/logs:/var/log/nginx
      - ./myblog-frontend/dist:/usr/share/nginx/html/frontend:ro
    depends_on:
      - backend
      - frontend
    networks:
      - myblog-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 后端服务
  backend:
    build:
      context: ./myblog-backend
      dockerfile: Dockerfile.prod
      target: prod-prebuilt # 使用预构建JAR，快速部署
    container_name: myblog-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: ${MYSQL_HOST:-172.17.0.1}
      MYSQL_PORT: ${MYSQL_PORT:-13306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-myblog}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-172.17.0.1}
      REDIS_PORT: ${REDIS_PORT:-26739}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-elasticsearch}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      # AI配置
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_COMPLETIONS_PATH: ${OPENAI_COMPLETIONS_PATH:-/v1/chat/completions}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.7}
      OPENAI_MAX_TOKENS_CHAT: ${OPENAI_MAX_TOKENS_CHAT:-700}
      OPENAI_MAX_TOKENS_TITLE: ${OPENAI_MAX_TOKENS_TITLE:-80}
      OPENAI_MAX_TOKENS_SUMMARY: ${OPENAI_MAX_TOKENS_SUMMARY:-260}
      OPENAI_MAX_TOKENS_KEYWORDS: ${OPENAI_MAX_TOKENS_KEYWORDS:-120}
      OPENAI_MAX_TOKENS_POLISH: ${OPENAI_MAX_TOKENS_POLISH:-1200}
      ENV_CONFIG_FILE: /app/.env
      # Kafka配置
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      JAVA_OPTS: "-Xms1g -Xmx2g -XX:+UseG1GC -XX:+UseContainerSupport"
    # 移除端口映射，只通过Nginx访问
    expose:
      - "8081"
    volumes:
      - ./data/backend/logs:/app/logs
      - ./data/backend/uploads:/app/uploads
      - ./.env:/app/.env:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - myblog-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # 前端服务
  frontend:
    build:
      context: ./myblog-frontend
      dockerfile: Dockerfile.prod
    container_name: myblog-frontend
    restart: unless-stopped
    # 移除端口映射，只通过Nginx访问
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - myblog-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Elasticsearch 全文搜索
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: myblog-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - myblog-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Kafka 通知消息队列 (KRaft模式，无需ZooKeeper)
  kafka:
    image: apache/kafka:3.7.0
    container_name: myblog-kafka
    restart: unless-stopped
    # ports:
    #   - "9092:9092"
    environment:
      # KRaft模式配置
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 监听器配置
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Topic配置
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 内存限制
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      # 日志保留策略
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - myblog-network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

networks:
  myblog-network:
    driver: bridge

volumes:
  es-data:
    driver: local
  kafka-data:
    driver: local
