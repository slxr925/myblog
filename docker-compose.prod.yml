services:
  # Nginx反向代理
  nginx:
    image: nginx:1.27-alpine
    container_name: myblog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/nginx/logs:/var/log/nginx
      - ./myblog-frontend/dist:/usr/share/nginx/html/frontend:ro
    depends_on:
      - backend
      - frontend
    networks:
      - myblog-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 后端服务
  backend:
    build:
      context: ./myblog-backend
      dockerfile: Dockerfile.prod
    container_name: myblog-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: ${MYSQL_HOST:-172.17.0.1}
      MYSQL_PORT: ${MYSQL_PORT:-13306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-myblog}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-172.17.0.1}
      REDIS_PORT: ${REDIS_PORT:-26739}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-false}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-172.17.0.1}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: "-Xms1g -Xmx2g -XX:+UseG1GC -XX:+UseContainerSupport"
    # 移除端口映射，只通过Nginx访问
    expose:
      - "8081"
    volumes:
      - ./data/backend/logs:/app/logs
      - ./data/backend/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - myblog-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # 前端服务
  frontend:
    build:
      context: ./myblog-frontend
      dockerfile: Dockerfile.prod
    container_name: myblog-frontend
    restart: unless-stopped
    # 移除端口映射，只通过Nginx访问
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - myblog-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  myblog-network:
    driver: bridge

