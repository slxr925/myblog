<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBlog 个人博客系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div id="app">
        <el-container class="layout-container">
            <!-- 头部导航 -->
            <el-header class="header">
                <div class="header-content">
                    <div class="logo">
                        <h2>MyBlog 博客系统</h2>
                    </div>
                    <el-menu
                        mode="horizontal"
                        :default-active="activeMenu"
                        class="header-menu"
                        @select="handleMenuSelect"
                        background-color="transparent"
                        text-color="#fff"
                        active-text-color="#ffd04b">
                        <el-menu-item index="home">首页</el-menu-item>
                        <el-menu-item index="categories">分类</el-menu-item>
                        <el-menu-item index="tags">标签</el-menu-item>
                        <el-menu-item index="about">关于</el-menu-item>
                        <el-sub-menu index="admin" v-if="isLoggedIn">
                            <template #title>管理</template>
                            <el-menu-item index="admin-blogs">博客管理</el-menu-item>
                            <el-menu-item index="admin-categories">分类管理</el-menu-item>
                            <el-menu-item index="admin-tags">标签管理</el-menu-item>
                        </el-sub-menu>
                        <el-menu-item index="login" v-if="!isLoggedIn">登录</el-menu-item>
                        <el-menu-item index="logout" v-if="isLoggedIn">退出</el-menu-item>
                    </el-menu>
                </div>
            </el-header>

            <el-container>
                <!-- 主要内容区域 -->
                <el-main class="main-content">
                    <!-- 首页 -->
                    <div v-if="currentView === 'home'" class="home-view">
                        <div class="hero-section">
                            <h1>欢迎来到 MyBlog</h1>
                            <p>基于 Spring Boot 3 + Vue 3 + Element Plus 构建的现代化博客系统</p>
                            <el-button type="primary" size="large" @click="testConnection">测试连接</el-button>
                        </div>
                        
                        <!-- 最新博客 -->
                        <div class="latest-blogs">
                            <h3>最新博客</h3>
                            <el-row :gutter="20">
                                <el-col :span="8" v-for="blog in blogs" :key="blog.id">
                                    <el-card class="blog-card" shadow="hover">
                                        <div class="blog-header">
                                            <h4>{{ blog.title }}</h4>
                                            <el-tag v-if="blog.isTop" type="danger" size="small">置顶</el-tag>
                                        </div>
                                        <p class="blog-summary">{{ blog.summary }}</p>
                                        <div class="blog-meta">
                                            <span>{{ blog.createTime }}</span>
                                            <span>阅读 {{ blog.viewCount }}</span>
                                            <span>点赞 {{ blog.likeCount }}</span>
                                        </div>
                                    </el-card>
                                </el-col>
                            </el-row>
                        </div>
                    </div>

                    <!-- 登录页面 -->
                    <div v-if="currentView === 'login'" class="login-view">
                        <el-card class="login-card">
                            <h2>用户登录</h2>
                            <el-form :model="loginForm" :rules="loginRules" ref="loginFormRef">
                                <el-form-item prop="username">
                                    <el-input
                                        v-model="loginForm.username"
                                        placeholder="用户名"
                                        prefix-icon="User">
                                    </el-input>
                                </el-form-item>
                                <el-form-item prop="password">
                                    <el-input
                                        v-model="loginForm.password"
                                        type="password"
                                        placeholder="密码"
                                        prefix-icon="Lock">
                                    </el-input>
                                </el-form-item>
                                <el-form-item>
                                    <el-button type="primary" @click="handleLogin" class="login-btn">登录</el-button>
                                </el-form-item>
                            </el-form>
                            <div class="register-link">
                                <span>还没有账号？</span>
                                <el-button type="text" @click="showRegister = true">立即注册</el-button>
                            </div>
                        </el-card>
                    </div>

                    <!-- 管理页面 -->
                    <div v-if="currentView.startsWith('admin')" class="admin-view">
                        <h2>{{ getAdminTitle() }}</h2>
                        <el-alert
                            title="演示说明"
                            type="info"
                            description="这是一个演示页面，展示了博客系统的基本功能结构。完整的后端API和数据库功能正在开发中。"
                            show-icon
                            :closable="false">
                        </el-alert>
                        
                        <div v-if="currentView === 'admin-blogs'" class="admin-blogs">
                            <el-button type="primary" @click="showCreateBlog = true">新建博客</el-button>
                            <el-table :data="blogs" style="width: 100%; margin-top: 20px;">
                                <el-table-column prop="title" label="标题" width="300"></el-table-column>
                                <el-table-column prop="categoryName" label="分类" width="120"></el-table-column>
                                <el-table-column prop="status" label="状态" width="100">
                                    <template #default="scope">
                                        <el-tag :type="scope.row.status === 1 ? 'success' : 'warning'">
                                            {{ scope.row.status === 1 ? '已发布' : '草稿' }}
                                        </el-tag>
                                    </template>
                                </el-table-column>
                                <el-table-column prop="viewCount" label="阅读量" width="100"></el-table-column>
                                <el-table-column prop="createTime" label="创建时间" width="180"></el-table-column>
                                <el-table-column label="操作">
                                    <template #default="scope">
                                        <el-button size="small" @click="editBlog(scope.row)">编辑</el-button>
                                        <el-button size="small" type="danger" @click="deleteBlog(scope.row)">删除</el-button>
                                    </template>
                                </el-table-column>
                            </el-table>
                        </div>
                    </div>
                </el-main>
            </el-container>
        </el-container>

        <!-- 注册对话框 -->
        <el-dialog v-model="showRegister" title="用户注册" width="400px">
            <el-form :model="registerForm" :rules="registerRules" ref="registerFormRef">
                <el-form-item label="用户名" prop="username">
                    <el-input v-model="registerForm.username"></el-input>
                </el-form-item>
                <el-form-item label="邮箱" prop="email">
                    <el-input v-model="registerForm.email"></el-input>
                </el-form-item>
                <el-form-item label="密码" prop="password">
                    <el-input v-model="registerForm.password" type="password"></el-input>
                </el-form-item>
                <el-form-item label="昵称" prop="nickname">
                    <el-input v-model="registerForm.nickname"></el-input>
                </el-form-item>
            </el-form>
            <template #footer>
                <span class="dialog-footer">
                    <el-button @click="showRegister = false">取消</el-button>
                    <el-button type="primary" @click="handleRegister">注册</el-button>
                </span>
            </template>
        </el-dialog>

        <!-- 创建博客对话框 -->
        <el-dialog v-model="showCreateBlog" title="创建博客" width="80%">
            <el-form :model="blogForm" label-width="80px">
                <el-form-item label="标题">
                    <el-input v-model="blogForm.title"></el-input>
                </el-form-item>
                <el-form-item label="摘要">
                    <el-input v-model="blogForm.summary" type="textarea" :rows="3"></el-input>
                </el-form-item>
                <el-form-item label="内容">
                    <el-input v-model="blogForm.content" type="textarea" :rows="10"></el-input>
                </el-form-item>
                <el-form-item label="分类">
                    <el-select v-model="blogForm.categoryId">
                        <el-option label="技术分享" value="1"></el-option>
                        <el-option label="生活随笔" value="2"></el-option>
                        <el-option label="学习笔记" value="3"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="状态">
                    <el-radio-group v-model="blogForm.status">
                        <el-radio :label="0">草稿</el-radio>
                        <el-radio :label="1">发布</el-radio>
                    </el-radio-group>
                </el-form-item>
            </el-form>
            <template #footer>
                <span class="dialog-footer">
                    <el-button @click="showCreateBlog = false">取消</el-button>
                    <el-button type="primary" @click="handleCreateBlog">保存</el-button>
                </span>
            </template>
        </el-dialog>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
