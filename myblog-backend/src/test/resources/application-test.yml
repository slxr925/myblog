# 测试环境配置
spring:
  config:
    activate:
      on-profile: test

  # 数据库配置 - 使用内存数据库
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""

  # Redis配置 - 使用Mock
  data:
    redis:
      host: localhost
      port: 6379
      database: 15  # 使用最后一个数据库
      timeout: 1s

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

# JWT配置
jwt:
  secret: test_jwt_secret_key_for_unit_testing_only_1234567890!@#$%
  expiration: 604800

# 文件上传配置
app:
  upload:
    path: /tmp/myblog-test/uploads
    url-prefix: /uploads
    max-file-size: 1
    max-image-size: 1
    secure-mode: true

# 日志配置
logging:
  level:
    com.ryan.myblog: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Elasticsearch配置 - 禁用
elasticsearch:
  enabled: false
  host: localhost
  port: 9200

# 服务器配置
server:
  port: 0  # 随机端口

# 安全测试配置
security:
  test-users:
    - username: testuser
      password: Test123!@#
      role: USER
    - username: testadmin
      password: Admin123!@#
      role: ADMIN