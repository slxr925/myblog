# 生产环境配置
spring:
  profiles:
    active: prod
  
  # 数据库配置 - 使用宿主机 MySQL (端口13306)
  datasource:
    url: jdbc:mysql://host.docker.internal:13306/myblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # Redis配置 - 使用宿主机 Redis (端口26739)
  data:
    redis:
      host: host.docker.internal
      port: 26739
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

# Elasticsearch配置 - 使用宿主机 ES (端口9200)
app:
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:true}
    uris: http://host.docker.internal:9200
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connection-timeout: 10s
    socket-timeout: 60s

  # 文件上传配置
  upload:
    path: /app/uploads
    url-prefix: /uploads
    max-file-size: 10
    max-image-size: 5
    secure-mode: true

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800

# 日志配置
logging:
  level:
    root: INFO
    com.ryan.myblog: INFO
    com.ryan.myblog.mapper: WARN
  file:
    name: /app/logs/myblog.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

# 服务器配置
server:
  port: 8081
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 8192

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    elasticsearch:
      enabled: true
