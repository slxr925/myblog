# 生产环境配置
spring:
  # 排除Arthas自动配置（Alpine JRE不支持agent attach）
  autoconfigure:
    exclude:
      - com.alibaba.arthas.spring.ArthasAutoConfiguration
      - com.alibaba.arthas.spring.ArtHashConfiguration
  
  # AI配置 - 通过环境变量配置
  ai:
    enabled: ${AI_ENABLED:false}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        enabled: ${AI_ENABLED:false}
        completions-path: ${OPENAI_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_TEMPERATURE:0.7}
          max-tokens-chat: ${OPENAI_MAX_TOKENS_CHAT:700}
          max-tokens-title: ${OPENAI_MAX_TOKENS_TITLE:80}
          max-tokens-summary: ${OPENAI_MAX_TOKENS_SUMMARY:260}
          max-tokens-keywords: ${OPENAI_MAX_TOKENS_KEYWORDS:120}
          max-tokens-polish: ${OPENAI_MAX_TOKENS_POLISH:1200}

  # 数据库配置 - 使用宿主机 MySQL (端口13306)
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:172.17.0.1}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:myblog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      minimum-idle: 3                    # 最小空闲连接（降低以节省内存）
      maximum-pool-size: 10              # 最大连接数（适配 2C2G 服务器）
      max-lifetime: 1800000              # 连接最大生命周期 30分钟
      idle-timeout: 600000               # 空闲连接超时 10分钟
      connection-timeout: 30000          # 连接超时 30秒
      validation-timeout: 5000           # 验证超时 5秒
      connection-test-query: SELECT 1    # 连接验证查询
      leak-detection-threshold: 60000    # 连接泄漏检测 60秒
  
  # Redis配置 - 使用宿主机 Redis (端口26739)
  # 注意：172.17.0.1 是Docker默认网关IP，用于容器访问宿主机服务
  data:
    redis:
      host: ${REDIS_HOST:172.17.0.1}
      port: ${REDIS_PORT:26739}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  # Kafka配置 - 通知消息队列
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      retries: 3
      acks: all

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

# Elasticsearch配置 - 使用宿主机 ES (端口9200)
app:
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:true}
    uris: http://${ELASTICSEARCH_HOST:172.17.0.1}:${ELASTICSEARCH_PORT:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connection-timeout: 10s
    socket-timeout: 60s

  # 文件上传配置
  upload:
    path: /app/uploads
    url-prefix: /uploads
    max-file-size: 10
    max-image-size: 5
    secure-mode: true

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800

# 日志配置
logging:
  level:
    root: INFO
    com.ryan.myblog: INFO
    com.ryan.myblog.mapper: WARN
  file:
    name: /app/logs/myblog.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

# 服务器配置
server:
  port: 8081
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 8192

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    elasticsearch:
      enabled: false  # 禁用Elasticsearch健康检查
    defaults:
      enabled: true

# ========== Arthas 配置 ==========
# 生产环境禁用Arthas（Alpine JRE不支持agent attach）
arthas:
  enabled: false
  # 如需启用，需使用JDK镜像并安装tools.jar

  agent-id: myblog-arthas-prod
  app-name: myblog-backend
