# 应用配置
app:
  elasticsearch:
    enabled: false  # 暂时禁用ES，等安装完成后启用

spring:
  application:
    name: myblog
  
  # 数据源配置 - 使用本地MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/myblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
        
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: none  # 使用手动创建的表
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  # SQL初始化配置
  sql:
    init:
      mode: never  # 生产环境不自动初始化
    
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  
  # Elasticsearch配置 - 暂时禁用，等ES安装完成后启用
  # elasticsearch:
  #   uris: http://localhost:9200
  #   username: 
  #   password: 
  #   connection-timeout: 10s
  #   socket-timeout: 60s

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: null
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.ryan.myblog.entity

# 日志配置
logging:
  level:
    com.ryan.myblog: debug
    com.ryan.myblog.mapper: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'

# JWT配置
jwt:
  secret: myBlogSecretKeyForJWTTokenGeneration2024!@#$%
  expiration: 604800 # 7天，单位秒

# 文件上传配置
spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 100MB

# 服务器配置
server:
  port: 9999