# 应用配置
app:
  # 缓存预热配置
  cache:
    warmup:
      enabled: ${CACHE_WARMUP_ENABLED:true}  # 启用缓存预热

  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:true}  # 启用Elasticsearch
    uris: http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connection-timeout: 10s
    socket-timeout: 60s

  # 自定义文件上传配置
  upload:
    path: ${UPLOAD_PATH:/app/uploads}
    url-prefix: ${UPLOAD_URL_PREFIX:/uploads}
    max-file-size: ${UPLOAD_MAX_FILE_SIZE_MB:10}
    max-image-size: ${UPLOAD_MAX_IMAGE_SIZE_MB:5}
    secure-mode: ${UPLOAD_SECURE_MODE:true}

# 通知系统 - 基于Kafka
# 本地开发：直接安装Kafka KRaft模式 (brew install kafka)
# 生产环境：Docker部署Kafka

spring:
  profiles:
    active: local  # 默认激活本地开发配置

  application:
    name: myblog

  # AI配置
  ai:
    enabled: ${AI_ENABLED:true}  # 默认启用AI功能
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://open.bigmodel.cn/api/coding/paas/v4}
      chat:
        enabled: ${AI_ENABLED:true}
        completions-path: ${OPENAI_COMPLETIONS_PATH:/chat/completions}  # 自定义API路径
        options:
          model: ${OPENAI_MODEL:GLM-4.7}
          temperature: 0.7

  # 自动配置排除
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration  # 禁用OpenAI自动配置

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:myblog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    # HikariCP 连接池配置（优化性能）
    hikari:
      minimum-idle: ${HIKARI_MIN_IDLE:3}              # 最小空闲连接
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}   # 最大连接池大小
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}    # 连接最大生命周期 30分钟
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}     # 空闲连接超时 10分钟
      connection-timeout: ${HIKARI_CONN_TIMEOUT:30000}  # 连接超时 30秒
      validation-timeout: ${HIKARI_VALID_TIMEOUT:5000}  # 验证超时 5秒
      connection-test-query: SELECT 1
      leak-detection-threshold: ${HIKARI_LEAK_DETECT:60000}  # 连接泄漏检测 60秒

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: none  # 使用手动创建的表
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # SQL初始化配置
  sql:
    init:
      mode: never  # 生产环境不自动初始化

  # Redis配置 - 使用环境变量增强安全性
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}  # 从环境变量或本地配置文件读取，默认空值
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_POOL_MAX_WAIT:-1ms}
      # 临时配置，避免Redis连接失败导致应用无法启动
      connect-timeout: 1000ms

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: null
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.ryan.myblog.entity

# 日志配置 - 基础配置，详细级别在本地配置文件中设置
logging:
  level:
    com.ryan.myblog: info  # 生产环境使用info级别
    com.ryan.myblog.mapper: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'

# JWT配置 - 具体配置在各profile文件中
jwt:
  secret: ${JWT_SECRET:}  # 从环境变量或profile配置文件读取
  expiration: ${JWT_EXPIRATION:604800} # 7天，单位秒

# 文件上传配置
spring.servlet.multipart:
  max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
  max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:100MB}

# 服务器配置
server:
  port: 8081 

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s
  health:
    elasticsearch:
      enabled: true  # 启用Elasticsearch健康检查

# Knife4j/SpringDoc配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ryan.myblog.controller

# Knife4j增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    enable-reload-cache-parameter: false
    enable-version: false
    enable-request-cache: true
    enable-filter-multipart-apis: false
    enable-filter-multipart-api-method-type: false
    enable-host: false
    enable-host-text: ""
    enable-dynamic-parameter: false
    enable-debug: true
    enable-footer: true
    enable-footer-custom: true
    footer-custom-content: "MyBlog API Documentation"
    enable-search: false
    enable-open-api: true
    enable-group: true
    enable-parameter-filter: false
    enable-response-filter: false
    enable-parameter-model: true
    enable-response-model: true
    enable-menu-filter: false
    enable-model-name-suffix: false
    enable-model-name-prefix: false
    enable-request-mapping-cache: false
    enable-bearer-auth: true

# 多环境配置
# 开发环境使用：--spring.profiles.active=local
# 生产环境使用：--spring.profiles.active=prod